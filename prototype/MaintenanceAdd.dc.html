<style>
html,body{margin:0;height:100%}
/* Tokens: light = Kitchen ink (section 1), dark = src/index.css dark block + the new nav tokens (section 12). */
.app{--bg:#E7EEEC;--card:#FFFFFF;--quiet:#F3F7F6;--text:#0E2A2C;--muted:#4A5E60;--line:#DDE6E4;--line-input:#6F8885;--ring:rgba(14,42,44,0.12);--header:#0E2A2C;--ink-raised:#1C3D40;--on-header-muted:#A9C4C2;--line-on-ink:#6F8E8C;--mint:#8EE6C9;--accent:#0B6B72;--accent-ink:#FFFFFF;--link:#0B6B72;--ok:#08555B;--ok-bg:#DFF5EE;--bad:#A9440C;--bad-text:#7E3209;--bad-bg:#FBE6D9;--icon-bg:#E7EEEC;--av-bg:#0E2A2C;--chip-on-bg:#0E2A2C;--chip-on-text:#FFFFFF;
--nav-bg:#0E2A2C;--nav-border:#0E2A2C;--nav-shadow:none;--menu-shadow:0 8px 24px rgba(14,42,44,0.18);--nav-strip:#E7EEEC;--safe-bottom:0px;
position:relative;width:100%;height:100vh;overflow:hidden;box-sizing:border-box;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column}
.app.dark{--bg:#0A1A1B;--card:#142E30;--quiet:#1B3638;--text:#E8F1EF;--muted:#A9C4C2;--line:#23403F;--line-input:#6F8E8C;--ring:rgba(232,241,239,0.16);--accent:#8EE6C9;--accent-ink:#0E2A2C;--link:#8EE6C9;--ok:#8EE6C9;--ok-bg:#12382F;--bad:#FF9F6E;--bad-text:#FF9F6E;--bad-bg:#3D1F10;--icon-bg:#1B3638;--av-bg:#1C3D40;--chip-on-bg:#8EE6C9;--chip-on-text:#0E2A2C;
--nav-bg:#284F52;--nav-border:#6F8E8C;--nav-shadow:0 8px 24px rgba(0,0,0,0.55);--menu-shadow:0 8px 24px rgba(0,0,0,0.6);--nav-strip:#0A1A1B}
.app.safe{--safe-bottom:34px}
.app a{color:var(--link)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.c-acc{stroke:var(--accent)}.c-text{stroke:var(--text)}.c-muted{stroke:var(--muted)}.c-bad{stroke:var(--bad)}.c-cur{stroke:currentColor}.c-mint{stroke:#8EE6C9}.c-white{stroke:#FFFFFF}

/* Main-tab header: shop name, NZ date, big title. Same height on Today, What's due, History and Team. */
.hd{flex:none;position:relative;z-index:3;background:var(--header);color:#FFFFFF;border-radius:0 0 28px 28px;padding:10px 20px 20px;display:flex;flex-direction:column}
.hd.flat{border-radius:0}
.hd-proto{margin:0 0 4px;font-size:12px;line-height:1.25;color:#A9C4C2}
.hd-top{display:flex;align-items:center;gap:12px;min-height:48px}
.hd-lines{flex:1;min-width:0}
.hd-shop{flex:1;min-width:0;margin:0;font-size:15px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-date{margin:2px 0 0;font-size:14px;line-height:1.25;color:#A9C4C2;white-space:nowrap}
.hd-date.b{margin:4px 0 0}
.hd-slot{flex:none;display:flex;justify-content:flex-end;max-width:55%;min-width:0}
.hd-title{margin:10px 0 0;font-size:44px;line-height:0.9;font-weight:900;letter-spacing:-0.045em;text-transform:uppercase;white-space:nowrap}
/* Shift chip: the app's .shift-avatar (48 px, 32 px mint circle, 15 px 600, name cut with an ellipsis, max 55%). */
.shift{flex:0 1 auto;min-width:48px;max-width:100%;min-height:48px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 14px 0 8px;border-radius:9999px;background:#1C3D40;color:#FFFFFF !important;text-decoration:none;font-size:15px;font-weight:600;white-space:nowrap}
.shift-c{flex:none;width:32px;height:32px;border-radius:9999px;background:#8EE6C9;color:#0E2A2C;display:flex;align-items:center;justify-content:center;font-weight:700}
.shift-n{position:relative;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hd-top.b .shift{max-width:46%}

/* Sub-screen and form header: Back + smaller title. */
.sub-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.sub-top .hd-proto{margin:0;white-space:nowrap}
@media (max-width:340px){.nav{font-size:12px;letter-spacing:-0.02em}}
@media (min-width:768px){.hd-title{font-size:52px}.sub-title{font-size:36px}}
.back{display:flex;align-items:center;gap:4px;min-height:48px;padding-right:12px;color:#FFFFFF !important;text-decoration:none;font-size:15px;font-weight:600;white-space:nowrap}
.sub-title{margin:6px 0 0;display:flex;align-items:center;gap:10px;font-size:32px;line-height:0.95;font-weight:900;letter-spacing:-0.045em;text-transform:uppercase}

/* Section heading: one style on every screen (uppercase via CSS, sentence case in the source). */
.sec{margin:8px 0 0;font-weight:900;font-size:20px;line-height:1.1;letter-spacing:-0.03em;text-transform:uppercase;color:var(--text);display:flex;align-items:center;gap:8px}
.sec.quiet{font-size:16px}
.sec .n{display:inline-flex;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:20px;background:var(--text);color:var(--bg);font-size:13px;letter-spacing:0;align-items:center;justify-content:center}
.sec .tag{text-transform:none;letter-spacing:0}

.scroll{flex:1;min-height:0;overflow:auto;padding:16px 16px 0;display:flex;flex-direction:column;gap:12px}
/* Room for the nav strip (12 px fade + 66 px pill + 12 px) plus a 12 px gap from the scroll gap. */
.endpad{flex:none;height:calc(90px + var(--safe-bottom))}
.endpad.tall{height:calc(152px + var(--safe-bottom))}

/* Bottom nav dock: the strip behind the pill (solid --nav-strip with a 12 px fade on top), safe-area aware. */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:2;box-sizing:border-box;padding:12px 12px calc(12px + var(--safe-bottom));background:linear-gradient(to bottom,rgba(0,0,0,0) 0,var(--nav-strip) 12px);display:flex;flex-direction:column;gap:10px}
.navbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:4px;border:1px solid var(--nav-border);border-radius:9999px;background:var(--nav-bg);box-shadow:var(--nav-shadow)}
.nav{min-height:56px;border-radius:9999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;color:#FFFFFF !important;text-decoration:none;letter-spacing:-0.01em;white-space:nowrap}
.nav[aria-current="page"]{background:#8EE6C9;color:#0E2A2C !important;font-weight:700}
.homebar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--text);opacity:.85;z-index:4}

.docket{flex:none;position:relative;background:var(--card);border-radius:20px;padding:12px 14px 12px 12px;text-decoration:none;color:var(--text) !important;display:flex;gap:12px;align-items:center;min-height:56px;box-sizing:border-box}
.ico{flex:none;width:44px;height:44px;border-radius:9999px;background:var(--icon-bg);display:flex;align-items:center;justify-content:center}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:9999px;border:1.5px solid currentColor;color:var(--muted);white-space:nowrap}
.t{margin:0;font-size:18px;line-height:1.1;font-weight:700;letter-spacing:-0.01em}
.s{margin:2px 0 0;font-size:15px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.help{margin:0;font-size:14px;color:var(--muted);line-height:1.35}
.src{display:block;margin-top:4px;font-size:13px;color:var(--muted)}
.mainBtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:9999px;background:var(--accent);color:var(--accent-ink) !important;text-decoration:none;font-weight:700;font-size:17px}
.go{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:9999px;border:2px solid var(--accent);background:var(--card);color:var(--accent) !important;text-decoration:none;font-weight:700;font-size:15px}

.proto{margin:8px 0 0;border:2px dashed var(--line-input);border-radius:20px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.proto p{margin:0;font-size:14px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 16px;border-radius:9999px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;background:var(--card);color:var(--text);border:2px solid var(--line-input)}
.chip[aria-pressed="true"]{background:var(--chip-on-bg);color:var(--chip-on-text);border-color:var(--chip-on-bg)}

.box{background:var(--card);border-radius:20px;padding:6px 16px}
.lrow{display:flex;align-items:center;gap:10px;min-height:56px;border-top:1px solid var(--line)}
.lrow.first{border-top:0}
.lrow b{font-size:17px}
.av{flex:none;width:36px;height:36px;border-radius:9999px;background:var(--av-bg);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.tbtn{flex:none;min-width:48px;min-height:48px;padding:0 6px;border:0;background:transparent;color:var(--link);font-family:inherit;font-size:15px;font-weight:700;text-decoration:underline;cursor:pointer}
.lbl{margin:0;font-size:16px;font-weight:700}
.addrow{display:flex;gap:8px}
.txt{flex:1;min-width:0;box-sizing:border-box;min-height:52px;border:2px solid var(--line-input);border-radius:16px;padding:10px 12px;font-family:inherit;font-size:16px;color:var(--text);background:var(--card)}
.txt::placeholder{color:var(--muted)}
.btn2{flex:none;min-height:52px;padding:0 16px;border-radius:9999px;border:2px solid var(--accent);background:var(--card);color:var(--accent);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.srow{display:flex;align-items:center;gap:12px;min-height:60px;color:var(--text) !important;text-decoration:none}
.dl{display:flex;align-items:center;gap:12px;min-height:52px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;font-family:inherit;cursor:pointer;padding:0;text-align:left;font-size:16px;font-weight:700;color:var(--link)}
.dl.first{border-top:0}
/* ui-tidy-a: compact Team lists. Row = name (+ type) + icon buttons; rare actions behind ⋯ (a disclosure panel, not an ARIA menu). */
.row2{position:relative;display:flex;align-items:center;gap:6px;min-height:64px;border-top:1px solid var(--line);padding:6px 0}
.row2.first{border-top:0}
.row2 .rico{flex:none;margin-right:4px}
.nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.nm b{font-size:17px;line-height:1.2;color:var(--text)}
.nm .meta{font-size:14px;line-height:1.3;color:var(--muted)}
.ibtn{flex:none;width:48px;height:48px;box-sizing:border-box;border-radius:9999px;border:2px solid var(--line-input);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ibtn[aria-disabled="true"]{border-color:var(--line);color:var(--line-input);cursor:default}
.more{flex:none;width:48px;height:48px;box-sizing:border-box;border-radius:9999px;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.more[aria-expanded="true"]{background:var(--icon-bg);box-shadow:inset 0 0 0 2px var(--line-input)}
.ibtn:focus-visible,.more:focus-visible,.addsm:focus-visible,.mi:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{position:absolute;right:0;top:calc(100% - 4px);z-index:5;min-width:224px;max-width:calc(100vw - 48px);box-sizing:border-box;background:var(--card);border:1px solid var(--line-input);border-radius:20px;box-shadow:var(--menu-shadow);padding:6px;display:flex;flex-direction:column;gap:2px}
.mi{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px 0 12px;border:0;border-radius:14px;background:transparent;font-family:inherit;font-size:16px;font-weight:600;color:var(--text);text-align:left;cursor:pointer}
.mi:hover{background:var(--quiet)}
.mi.danger{color:var(--bad-text)}
.addsm{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:48px;box-sizing:border-box;padding:0 18px 0 14px;border-radius:9999px;border:2px solid var(--accent);background:var(--card);color:var(--accent) !important;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.linkbtn{align-self:flex-start;min-height:48px;padding:0 4px;border:0;background:transparent;font-family:inherit;font-size:15px;font-weight:700;color:var(--link);text-decoration:underline;cursor:pointer}
.formbox{background:var(--card);border-radius:20px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px}
.formhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.formhead .lbl{font-size:17px}
.typegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.typegrid .chip{padding:0 8px}
.confirm{display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px;margin:0 0 8px;border-radius:16px;background:var(--quiet);border:1px solid var(--line)}
.confirm p{margin:0;font-size:15px;line-height:1.4}
.confirm .btns{display:flex;flex-wrap:wrap;gap:8px}
.btn2.warn{border-color:var(--bad);color:var(--bad-text)}
.btn2.fill{background:var(--accent);color:var(--accent-ink)}
.rnform{display:flex;flex-direction:column;gap:6px;padding:10px 0 12px;border-top:1px solid var(--line)}
.ctitle{margin:0;padding:10px 0 2px;font-size:17px;font-weight:700}
@media (max-width:360px){.row2 .rico{display:none}}
/* ui-tidy-a item 5: the shared signed field (SignedTempField), token version so it works in light and dark. */
.sfield{display:flex;align-items:center;gap:4px;height:64px;box-sizing:border-box;border:2px solid var(--line-input);border-radius:16px;background:var(--card);padding:0 14px 0 6px}
.sfield:focus-within{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.sfield input{flex:1;min-width:120px;width:100%;height:100%;box-sizing:border-box;border:0;outline:0;background:transparent;font-family:inherit;font-size:32px;font-weight:800;letter-spacing:-0.02em;text-align:left;padding:0 0 0 10px;color:var(--text)}
.sfield input::placeholder{color:var(--muted);opacity:.6}
.sfield .u{flex:none;font-size:22px;color:var(--muted);font-weight:800;letter-spacing:-0.02em}
.sign{flex:none;width:48px;height:48px;box-sizing:border-box;border-radius:12px;border:1.5px solid var(--line-input);background:var(--icon-bg);color:var(--text);font-family:inherit;font-size:30px;line-height:1;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 0 3px}
.sign:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.readback{margin:0;font-size:15px;font-weight:700}
.card{background:var(--card);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ans{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:9999px;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer}
.ans.ok{border:0;background:var(--accent);color:var(--accent-ink)}
.ans.bad{border:2px solid var(--bad);background:var(--card);color:var(--bad-text)}
/* equipment (set C): extra tokens. Disabled answer fill and the label on a warn-filled button, light and dark. */
.app{--dis-bg:#D5DFDC;--bad-ink:#FFFFFF}
.app.dark{--dis-bg:#1B3638;--bad-ink:#0E2A2C}
.why{flex:none;min-width:48px;min-height:48px;margin:-8px -8px -8px 0;padding:0 8px;border:0;background:transparent;font-family:inherit;font-size:15px;font-weight:700;color:var(--link);text-decoration:underline;cursor:pointer}
.whybox{margin:0;padding:10px 12px;border-radius:16px;background:var(--quiet);font-size:14px;line-height:1.4;color:var(--text)}
.hd-sub{margin:8px 0 0;font-size:15px;line-height:1.3;color:#A9C4C2}
.card{background:var(--card);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card.warn{box-shadow:inset 0 0 0 2px var(--bad)}
.field{width:100%;box-sizing:border-box;min-height:52px;border:2px solid var(--line-input);border-radius:16px;padding:10px 12px;font-family:inherit;font-size:16px;color:var(--text);background:var(--card)}
textarea.field{min-height:76px;resize:vertical;line-height:1.35}
.field:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.field::placeholder{color:var(--muted)}
.lbl .opt{font-weight:400;font-size:14px;color:var(--muted)}
.seg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg{min-height:56px;padding:4px 10px;border-radius:9999px;font-family:inherit;font-size:15px;font-weight:700;line-height:1.15;cursor:pointer;background:var(--card);color:var(--text);border:2px solid var(--line-input)}
.seg[aria-pressed="true"]{background:var(--chip-on-bg);color:var(--chip-on-text);border-color:var(--chip-on-bg)}
.chip.wrap{line-height:1.15;padding:4px 14px}
.preset{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;box-sizing:border-box;padding:8px 12px;border-radius:28px;border:2px solid var(--quiet);background:var(--quiet);font-family:inherit;font-size:16px;font-weight:700;line-height:1.25;color:var(--text);text-align:left;cursor:pointer}
.preset[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--accent)}
.preset .mk{flex:none;width:28px;height:28px;box-sizing:border-box;border-radius:14px;border:2px solid var(--line-input);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--accent-ink)}
.preset[aria-pressed="true"] .mk{background:var(--accent);border-color:var(--accent)}
.qchip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 16px 0 12px;border-radius:9999px;border:2px solid var(--line-input);background:var(--card);color:var(--text);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.datebtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;box-sizing:border-box;min-height:52px;border:2px solid var(--line-input);border-radius:16px;padding:10px 12px;font-family:inherit;font-size:16px;color:var(--text);background:var(--card);text-align:left;cursor:pointer}
.wholine{display:flex;align-items:center;gap:10px;min-height:48px}
.wholine p{flex:1;min-width:0;margin:0;font-size:16px;line-height:1.3}
.ans{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:56px;box-sizing:border-box;border-radius:9999px;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;text-decoration:none}
.ans.ok{border:0;background:var(--accent);color:var(--accent-ink) !important}
.ans.bad{border:2px solid var(--bad);background:var(--card);color:var(--bad-text)}
.ans.bad[aria-pressed="true"]{background:var(--bad-bg)}
.ans[aria-disabled="true"]{background:var(--dis-bg);color:var(--muted) !important;border:0;cursor:default}
.note-bad{margin:0;font-size:15px;font-weight:700;color:var(--bad-text);line-height:1.35}
.sBad{margin:0;padding:10px 14px;border-radius:20px;background:var(--bad-bg);color:var(--bad-text);font-weight:700;font-size:15px;line-height:1.35}
.err{margin:0;padding:8px 12px;border-radius:16px;background:var(--bad-bg);color:var(--bad-text);font-weight:700;font-size:15px;line-height:1.35}
/* Bottom action bar on forms (no nav), the same strip as the nav dock. */
.fbar{flex:none;padding:10px 16px calc(14px + var(--safe-bottom));background:var(--bg);border-top:1px solid var(--line)}
.btnMain{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:9999px;font-weight:700;font-size:17px;text-decoration:none;text-align:center;padding:0 16px}
.btnMain.ok{background:var(--accent);color:var(--accent-ink) !important}
.btnMain.warn{background:var(--bad);color:var(--bad-ink) !important}
.btnMain.off{background:var(--dis-bg);color:var(--muted) !important}
/* Equipment rows: the name area is the link to the item page; ⋯ sits beside it (never inside the link). */
a.nm{text-decoration:none;color:var(--text) !important;min-height:48px;justify-content:center;border-radius:12px}
a.nm:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.subhd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 0 4px;border-top:1px solid var(--line)}
.subhd b{font-size:15px}
.subhd .help a{font-weight:700}
.panelform{display:flex;flex-direction:column;gap:8px;padding:6px 0 12px;border-top:1px solid var(--line)}
.panelform .lbl{font-size:15px}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border:2px dashed var(--line-input);border-radius:20px;text-align:center}
.empty p{margin:0;font-size:15px;color:var(--muted)}
.subhd.first{border-top:0;padding-top:8px}
/* Long back labels (an item name) never push the prototype label off screen at 320 px. */
.sub-top .back{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.sub-top .hd-proto{flex:0 1 auto;min-width:0;white-space:normal;text-align:right}
</style>
</helmet>
<div class="{{appClass}}">
  <header class="hd" style="padding-top: 6px">
    <div class="sub-top">
      <a class="back" href="{{backHref}}"><svg class="ic c-white" width="20" height="20" viewBox="0 0 24 24" style="stroke-width: 2.2" aria-hidden="true"><path d="{{ic.back}}"></path></svg>{{item}}</a>
      <p class="hd-proto">Prototype with sample data</p>
    </div>
    <h1 class="sub-title">Maintenance or repair</h1>
  </header>

  <div class="scroll" style="padding-top: 16px">
    <!-- EQ-8 Who did it? / When?: one line with the on-shift person and today; Change opens the date and the staff chips. -->
    <div class="card" style="padding-top: 8px; padding-bottom: 8px">
      <div class="wholine">
        <svg class="ic c-acc" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.person}}"></path></svg>
        <p>{{whoLine}}</p>
        <button type="button" class="tbtn" aria-expanded="{{whoExpanded}}" aria-controls="who-box" onClick="{{toggleWho}}">{{whoBtn}}</button>
      </div>
      <sc-if value="{{whoOpen}}" hint-placeholder-val="{{ false }}">
        <div id="who-box" style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px">
          <label class="lbl" for="m-date">When?</label>
          <button type="button" id="m-date" class="datebtn">Today, Sunday 25 October<svg class="ic c-acc" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.calendar}}"></path></svg></button>
          <p class="lbl" id="who-l" style="margin-top: 4px">Who did it?</p>
          <div class="chips" role="group" aria-labelledby="who-l">
            <sc-for list="{{people}}" as="p" hint-placeholder-count="5">
              <button type="button" class="chip" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}">{{p.label}}</button>
            </sc-for>
          </div>
          <sc-if value="{{isElse}}" hint-placeholder-val="{{ false }}">
            <label class="lbl" for="m-name" style="margin-top: 4px">Name</label>
            <input id="m-name" class="field" type="text" maxlength="60" autocomplete="off" value="{{elseName}}" onInput="{{onElse}}">
          </sc-if>
        </div>
      </sc-if>
    </div>

    <div class="{{mainCard}}">
      <p class="lbl" id="kind-l">What kind?</p>
      <div class="seg2" role="group" aria-labelledby="kind-l">
        <sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
          <button type="button" class="seg" aria-pressed="{{k.pressed}}" onClick="{{k.pick}}">{{k.label}}</button>
        </sc-for>
      </div>
      <!-- EQ-10: a repair after a fault is the problem record (E4): what went wrong, the fix, food safe, prevent. -->
      <sc-if value="{{repair}}" hint-placeholder-val="{{ false }}">
        <label class="lbl" for="m-wrong" style="margin-top: 4px">What went wrong?</label>
        <textarea id="m-wrong" class="field" maxlength="300" value="{{wrong}}" onInput="{{onWrong}}"></textarea>
      </sc-if>
      <label class="lbl" for="m-what" style="margin-top: 4px">What was done?</label>
      <textarea id="m-what" class="field" maxlength="300" value="{{what}}" onInput="{{onWhat}}"></textarea>
      <sc-if value="{{repair}}" hint-placeholder-val="{{ false }}">
        <p class="lbl" id="safe-l" style="margin-top: 4px">How did you keep food safe?</p>
        <div role="group" aria-labelledby="safe-l" style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{safe}}" as="p" hint-placeholder-count="2">
            <button type="button" class="preset" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}"><span class="mk" aria-hidden="true">{{p.mark}}</span><span style="flex: 1">{{p.label}}</span></button>
          </sc-for>
        </div>
        <sc-if value="{{safeOther}}" hint-placeholder-val="{{ false }}">
          <label class="vh" for="m-safe">How did you keep food safe? Other</label>
          <textarea id="m-safe" class="field" maxlength="500"></textarea>
        </sc-if>
        <label class="lbl" for="m-prevent" style="margin-top: 4px">What will stop it happening again? <span class="opt">(optional)</span></label>
        <button type="button" class="qchip" onClick="{{addPrevent}}"><svg class="ic c-acc" width="18" height="18" viewBox="0 0 24 24" style="stroke-width: 2.4" aria-hidden="true"><path d="{{ic.plus}}"></path></svg>Service it regularly</button>
        <textarea id="m-prevent" class="field" maxlength="500" value="{{prevent}}" onInput="{{onPrevent}}"></textarea>
      </sc-if>
    </div>

    <div class="proto">
      <p>Prototype only: try another sample</p>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <div class="chips" role="group" aria-label="{{g.label}}">
          <sc-for list="{{g.chips}}" as="c" hint-placeholder-count="2">
            <button type="button" class="chip" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.label}}</button>
          </sc-for>
        </div>
      </sc-for>
    </div>
    <div style="flex: none; height: 8px"></div>
  </div>

  <!-- EQ-8 Save hint: the first unmet item (training-due W4). A repair saves as a problem record (warn button). -->
  <div class="fbar">
    <sc-if value="{{canSave}}" hint-placeholder-val="{{ false }}">
      <a class="{{saveCls}}" href="{{backHref}}">{{saveLabel}}</a>
    </sc-if>
    <sc-if value="{{cannotSave}}" hint-placeholder-val="{{ true }}">
      <span class="btnMain off" role="status">{{saveHint}}</span>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const h = (typeof location !== 'undefined' ? location.hash : '').slice(1).split(',');
    const osDark = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches;
    const s = ['service', 'repair', 'repairdone', 'someone'].find((k) => h.indexOf(k) >= 0) || 'empty';
    this.state = Object.assign({ dark: h.indexOf('dark') >= 0 || (h.indexOf('light') < 0 && osDark), sample: s }, this.sampleState(s));
  }
  sampleState(s) {
    const base = { kind: null, what: '', wrong: '', safe: null, prevent: '', who: 'Mia', elseName: '', whoOpen: false };
    // EQ-9: Mia, Check or service, "Descaled the coffee machine" → 3 actions (kind, text, Save).
    if (s === 'service') return Object.assign(base, { kind: 'routine', what: 'Descaled the coffee machine' });
    // EQ-10 / EQ-11: a repair on the unit "Walk-in chiller"; food-safe answer still missing → Save blocked.
    if (s === 'repair') return Object.assign(base, { kind: 'repair', wrong: 'Door seal torn', what: 'Replaced the door seal' });
    if (s === 'repairdone') return Object.assign(base, { kind: 'repair', wrong: 'Door seal torn', what: 'Replaced the door seal', safe: 'none', prevent: 'Service it regularly' });
    // EQ-8 Someone else → Name (a contractor, §4 "Who did it").
    if (s === 'someone') return Object.assign(base, { kind: 'routine', what: 'Cleaned the condenser coil', who: 'else', elseName: 'Cool Air Refrigeration', whoOpen: true });
    return base;
  }
  renderVals() {
// Line icons: 24 px grid, 2 px stroke, round ends (design-system.md section 8). scale and gauge are new (equipment).
    const ic = {
      back: 'M15 6l-6 6 6 6',
      chevron: 'M9 6l6 6-6 6',
      plus: 'M12 5v14M5 12h14',
      dots: 'M5.5 12h.01M12 12h.01M18.5 12h.01',
      pen: 'M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16zM13.5 6.5l4 4',
      archive: 'M3.5 4.5h17v4h-17zM5 8.5v11h14v-11M10 12.5h4',
      calendar: 'M5.5 5h13a2 2 0 012 2v11.5a2 2 0 01-2 2h-13a2 2 0 01-2-2V7a2 2 0 012-2zM3.5 10h17M8 3v4M16 3v4',
      thermometer: 'M10 14.5V5a2 2 0 014 0v9.5a3.5 3.5 0 11-4 0zM12 9.5v7',
      scale: 'M12 4v15M7 19.5h10M5 7.5h14M5 7.5l-2.5 6a2.5 2.5 0 005 0zM19 7.5l-2.5 6a2.5 2.5 0 005 0z',
      gauge: 'M4 16a8 8 0 1116 0M12 16l4-5M4 16h2M18 16h2M12 8v1.5',
      service: 'M14.7 6.3a4 4 0 00-5.4 5.2L3.5 17.3a1.8 1.8 0 002.5 2.5l5.8-5.8a4 4 0 005.2-5.4l-2.6 2.6-2.3-.4-.4-2.3z',
      fridge: 'M7 2.5h10a2 2 0 012 2v15a2 2 0 01-2 2H7a2 2 0 01-2-2v-15a2 2 0 012-2zM5 9.5h14M8.5 5.5v1.5M8.5 12.5v3',
      snow: 'M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5L12 6l2.5-1.5M9.5 19.5L12 18l2.5 1.5',
      hotHold: 'M3 13h18M5 13v4.5a2 2 0 002 2h10a2 2 0 002-2V13M8 4.5c-1 1.2 1 2.3 0 3.5M12 4.5c-1 1.2 1 2.3 0 3.5M16 4.5c-1 1.2 1 2.3 0 3.5',
      problem: 'M10.3 3.9L2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0zM12 9v4.5M12 17v.5',
      lock: 'M6 11h12v10H6zM8.5 11V7.5a3.5 3.5 0 017 0V11',
      info: 'M12 21a9 9 0 100-18 9 9 0 000 18zM12 11v5.5M12 7.5v.5',
      check: 'M5 12l5 5L20 7',
      person: 'M12 12a4 4 0 100-8 4 4 0 000 8zM4.5 21a7.5 7.5 0 0115 0',
      today: 'M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17M11 6.5h9M11 12.5h9M11 18.5h9',
      history: 'M4 12a8 8 0 102.4-5.7M4 3.5v4.5h4.5M12 8v4l2.5 2',
      team: 'M9 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM2.5 20a6.5 6.5 0 0113 0M16 4.3a3.5 3.5 0 010 6.4M18 13.5a6.5 6.5 0 013.5 6'
    };
    const st = this.state;
    const repair = st.kind === 'repair';
    const item = st.sample === 'service' || st.sample === 'empty' ? 'Coffee machine' : 'Walk-in chiller';
    const whoName = st.who === 'else' ? (st.elseName.trim() || 'someone else') : st.who;
    const whoOk = st.who !== 'else' || st.elseName.trim().length > 0;
    let saveHint = '';
    if (st.kind === null) saveHint = 'Pick what kind';
    else if (repair && st.wrong.trim() === '') saveHint = 'Add what went wrong';
    else if (st.what.trim() === '') saveHint = 'Add what was done';
    else if (!whoOk) saveHint = 'Add who did it';
    else if (repair && st.safe === null) saveHint = 'Add how food was kept safe';
    const canSave = saveHint === '';
    const chips = (cur, opts, pick) => opts.map(([k, label]) => ({ label, pressed: cur === k ? 'true' : 'false', pick: () => pick(k) }));
    return {
      ic,
      appClass: 'app' + (st.dark ? ' dark' : ''),
      item, backHref: item === 'Walk-in chiller' ? 'EquipmentItem.dc.html#unit' : 'EquipmentItem.dc.html',
      whoLine: 'Done by ' + whoName + ' · Today',
      whoOpen: st.whoOpen, whoExpanded: st.whoOpen ? 'true' : 'false', whoBtn: st.whoOpen ? 'Close' : 'Change',
      toggleWho: () => this.setState({ whoOpen: !st.whoOpen }),
      people: chips(st.who, [['Mia', 'Mia'], ['Arjun', 'Arjun'], ['Hana', 'Hana'], ['Somchai', 'Somchai'], ['else', 'Someone else']], (k) => this.setState({ who: k })),
      isElse: st.who === 'else', elseName: st.elseName, onElse: (e) => this.setState({ elseName: e.target.value }),
      kinds: chips(st.kind, [['routine', 'Check or service'], ['repair', 'Repair after a fault']], (k) => this.setState({ kind: k })),
      mainCard: 'card' + (repair ? ' warn' : ''),
      repair,
      what: st.what, onWhat: (e) => this.setState({ what: e.target.value }),
      wrong: st.wrong, onWrong: (e) => this.setState({ wrong: e.target.value }),
      safe: [['none', 'No food was affected'], ['other', 'Other']].map(([k, label]) => ({
        label, pressed: st.safe === k ? 'true' : 'false', mark: st.safe === k ? '✓' : '', pick: () => this.setState({ safe: k }) })),
      safeOther: st.safe === 'other',
      prevent: st.prevent, onPrevent: (e) => this.setState({ prevent: e.target.value }),
      addPrevent: () => this.setState({ prevent: st.prevent ? st.prevent : 'Service it regularly' }),
      canSave, cannotSave: !canSave, saveHint,
      saveCls: 'btnMain ' + (repair ? 'warn' : 'ok'),
      saveLabel: repair ? 'Save problem record' : 'Save record',
      groups: [
        { label: 'Sample', chips: chips(st.sample, [['empty', 'Empty'], ['service', 'Check or service'], ['repair', 'Repair, food safe missing'], ['repairdone', 'Repair, ready'], ['someone', 'Someone else']], (k) => this.setState(Object.assign({ sample: k }, this.sampleState(k)))) },
        { label: 'Colour mode', chips: chips(st.dark, [[false, 'Light'], [true, 'Dark']], (k) => this.setState({ dark: k })) },
      ],
    };
  }
}
</script>
</body>
</html>
