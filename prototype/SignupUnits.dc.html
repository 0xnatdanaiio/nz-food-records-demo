<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<style>html{touch-action:manipulation}@media (min-width:520px){html,body{background:#0E2A2C}body>div>div>div[style*="width: 390px"]{margin:24px auto;border-radius:28px;overflow:hidden}}</style>
<title>SousMate – Your fridges and freezers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6B72}a:hover{color:#08555B}
.docket{flex:none;position:relative;background:#FFFFFF;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.help{margin:0;font-size:14px;color:#4A5E60;line-height:1.4}
.field{width:100%;box-sizing:border-box;min-height:52px;border:2px solid #6F8885;border-radius:16px;padding:10px 12px;font:inherit;font-size:16px;color:#0E2A2C;background:#FFFFFF}
.field::placeholder{color:#6F8885}
.field:focus{outline:3px solid #0B6B72;outline-offset:1px;border-color:#0B6B72}
label,.lb{margin:0;font-weight:700;font-size:16px}
.opt{font-weight:400;color:#4A5E60;font-size:14px}
.main{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;min-height:56px;padding:0 16px;border:0;border-radius:9999px;background:#0B6B72;color:#FFFFFF;text-decoration:none;font-family:inherit;font-weight:700;font-size:17px;cursor:pointer;text-align:center}
a.main:hover{color:#FFFFFF;background:#08555B}
.main.off{background:#D5DFDC;color:#4A5E60;cursor:default}
.tlink{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 8px;font-family:inherit;font-weight:700;font-size:15px;color:#0B6B72;text-decoration:underline;background:none;border:0;cursor:pointer}
.go{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 16px;box-sizing:border-box;border-radius:9999px;border:2px solid #0B6B72;background:#FFFFFF;color:#0B6B72;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}
.go.off{border-color:#D5DFDC;color:#4A5E60;cursor:default}
.box{margin:0;display:flex;gap:8px;align-items:flex-start;padding:12px 14px;border-radius:20px;font-size:15px;line-height:1.35}
.box svg{flex:none;margin-top:1px}
.bad{background:#FBE6D9;color:#7E3209;font-weight:700}
.ok{background:#DFF5EE;color:#08555B;font-weight:700}
.info{background:#F3F7F6;color:#0E2A2C;border:1px solid #DDE6E4}
.back{display:flex;align-items:center;gap:4px;min-height:48px;margin:-2px 0;padding-right:12px;color:#FFFFFF;text-decoration:none;font-size:15px}
a.back:hover{color:#FFFFFF}
.proto{margin:0;font-size:12px;color:#A9C4C2}
.ttl{margin:0;font-size:36px;line-height:0.9;font-weight:900;letter-spacing:-0.045em;text-transform:uppercase}
.sub{margin:0;font-size:14px;color:#A9C4C2;line-height:1.35}
.steps{margin:0;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#A9C4C2}
.bar{width:26px;height:6px;border-radius:3px;background:#1C3D40;border:1px solid #6F8E8C;box-sizing:border-box}
.bar.on{background:#8EE6C9;border-color:#8EE6C9}
.foot{flex:none;padding:12px 16px 16px;background:#E7EEEC;display:flex;flex-direction:column;gap:4px}
.sample{flex:none;margin-top:4px;border:2px dashed #6F8885;border-radius:20px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.sample p{margin:0;font-size:14px;font-weight:700;color:#4A5E60}
.item{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid #DDE6E4}
.item:first-of-type{border-top:0}
.ico{flex:none;width:44px;height:44px;border-radius:9999px;background:#E7EEEC;display:flex;align-items:center;justify-content:center}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:9999px;border:1.5px solid currentColor;white-space:nowrap;color:#4A5E60}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E7EEEC; font-family: 'Inter', system-ui, sans-serif; color: #0E2A2C; display: flex; flex-direction: column">
  <div style="flex: none; background: #0E2A2C; color: #FFFFFF; border-radius: 0 0 28px 28px; padding: 14px 20px 22px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px">
      <a class="back" href="SignupStaff.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.back}}"></path></svg>Back</a>
      <p class="proto">Prototype with sample data</p>
    </div>
    <p class="steps"><span class="bar on"></span><span class="bar on"></span><span class="bar on"></span><span class="bar"></span><span style="margin-left: 4px">Set up · Step 3 of 4</span></p>
    <h1 class="ttl" tabindex="-1" style="font-size: 32px">Your fridges and freezers</h1>
  </div>

  <div style="flex: 1; overflow: auto; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 14px">
    <div class="docket">
      <p class="help" style="font-size: 15px; color: #0E2A2C">Today asks for a check of each one every day.</p>
      <sc-if value="{{showSuggest}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{addSuggest}}" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px 0 12px; border-radius: 9999px; border: 2px dashed #0B6B72; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #0E2A2C; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B6B72" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.plus}}"></path></svg><span style="flex: 1; text-align: left"><b>Fridge 1</b> · Fridge</span><span style="font-size: 13px; color: #4A5E60">Suggested</span></button>
      </sc-if>
      <label for="uname">Name</label>
      <input id="uname" class="field" autocomplete="off" placeholder="For example: Walk-in" value="{{draft}}" onInput="{{onDraft}}">
      <p id="type-l" class="lb">Type</p>
      <div role="group" aria-labelledby="type-l" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
      <sc-if value="{{canPart}}" hint-placeholder-val="{{ true }}">
        <button type="button" aria-pressed="{{partPressed}}" onClick="{{togglePart}}" style="{{partStyle}}"><span style="{{partBox}}" aria-hidden="true">✓</span>It has a freezer part too</button>
      </sc-if>
      <sc-if value="{{showErr}}" hint-placeholder-val="{{ false }}">
        <p class="box bad" role="status"><span>{{err}}</span></p>
      </sc-if>
      <button type="button" class="go" onClick="{{add}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B6B72" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.plus}}"></path></svg>Add</button>
    </div>
    <sc-if value="{{hasUnits}}" hint-placeholder-val="{{ false }}">
      <div class="docket" style="gap: 0; padding-top: 10px; padding-bottom: 6px">
        <p class="lb" style="margin-bottom: 4px">Added · {{count}}</p>
        <sc-for list="{{units}}" as="u" hint-placeholder-count="2">
          <div class="item">
            <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B6B72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.fridge}}"></path></svg></span>
            <span style="flex: 1; min-width: 0"><b style="font-size: 17px">{{u.name}}</b><br><span style="font-size: 14px; color: #4A5E60">{{u.type}}</span></span>
            <button type="button" class="tlink" onClick="{{u.remove}}" aria-label="{{u.removeLabel}}">Remove</button>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <div style="flex: 1"></div>
    <div class="sample">
      <p id="sample-l">Prototype only: try another sample</p>
      <div role="group" aria-labelledby="sample-l" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{samples}}" as="p" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
        </sc-for>
      </div>
    </div>
  </div>

  <div class="foot">
    <a class="main" href="SignupDates.dc.html">{{nextLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sample: 'empty', draft: '', type: 'Fridge', part: false, units: [], err: '' };
  }
  renderVals() {
    // Line icons: 24 px grid, 2 px stroke, round ends (design-system.md section 8)
    const ic = {
      back: 'M15 6l-6 6 6 6',
      problem: 'M10.3 3.9L2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0zM12 9v4.5M12 17v.5',
      plus: 'M12 5v14M5 12h14',
      fridge: 'M7 2.5h10a2 2 0 012 2v15a2 2 0 01-2 2H7a2 2 0 01-2-2v-15a2 2 0 012-2zM5 9.5h14M8.5 5.5v1.5M8.5 12.5v3'
    };
    const chipBase = 'min-height: 48px; padding: 0 14px; border-radius: 9999px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; ';
    const mkSamples = (list, cur, pick) => list.map((d) => ({
      label: d.label,
      pressed: cur === d.k ? 'true' : 'false',
      style: chipBase + (cur === d.k ? 'background: #0E2A2C; color: #FFFFFF; border: 2px solid #0E2A2C' : 'background: #FFFFFF; color: #0E2A2C; border: 2px solid #6F8885'),
      pick: () => pick(d.k),
    }));
    const tickRow = (on) => 'display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 14px; box-sizing: border-box; border-radius: 28px; font-family: inherit; font-size: 16px; font-weight: 700; color: #0E2A2C; text-align: left; cursor: pointer; ' + (on ? 'background: #DFF5EE; border: 2px solid #0B6B72' : 'background: #F3F7F6; border: 2px solid #F3F7F6');
    const tickBox = (on) => 'flex: none; width: 26px; height: 26px; border-radius: 6px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 17px; ' + (on ? 'background: #0B6B72; color: #FFFFFF; border: 2px solid #0B6B72' : 'background: #FFFFFF; color: #FFFFFF; border: 2px solid #6F8885');
    const st = this.state;
    const segBase = 'min-height: 48px; border-radius: 9999px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; ';
    // addUnit rules: name 1-60 characters, trimmed, no duplicate name (case-insensitive).
    const push = (name, type, part) => {
      const n = name.trim();
      if (!n) return this.setState({ err: '! Enter a name' });
      if (n.length > 60) return this.setState({ err: '! The name is too long (max 60 characters)' });
      if (st.units.some((x) => x.name.toLowerCase() === n.toLowerCase())) return this.setState({ err: '! This name is already in the list' });
      let add = [{ name: n, type }];
      if (part) add = add.concat([{ name: n + ' – freezer', type: 'Freezer' }]);
      this.setState({ units: st.units.concat(add), draft: '', part: false, err: '' });
    };
    return {
      ic,
      draft: st.draft,
      onDraft: (e) => this.setState({ draft: e.target.value, err: '' }),
      // Suggestion, not saved until tapped (crit. 10).
      showSuggest: !st.units.some((u) => u.name === 'Fridge 1'),
      addSuggest: () => push('Fridge 1', 'Fridge', false),
      types: ['Fridge', 'Chiller', 'Freezer'].map((t) => ({
        label: st.type === t ? '✓ ' + t : t,
        pressed: st.type === t ? 'true' : 'false',
        style: segBase + (st.type === t ? 'background: #0E2A2C; color: #FFFFFF; border: 2px solid #0E2A2C' : 'background: #FFFFFF; color: #0E2A2C; border: 2px solid #6F8885'),
        pick: () => this.setState({ type: t, part: t === 'Freezer' ? false : st.part }),
      })),
      canPart: st.type !== 'Freezer',
      partPressed: st.part ? 'true' : 'false',
      partStyle: tickRow(st.part),
      partBox: tickBox(st.part),
      togglePart: () => this.setState({ part: !st.part }),
      add: () => push(st.draft, st.type, st.part),
      showErr: !!st.err,
      err: st.err,
      hasUnits: st.units.length > 0,
      count: String(st.units.length),
      units: st.units.map((u) => ({
        name: u.name,
        type: u.type,
        removeLabel: 'Remove ' + u.name,
        // Remove archives the unit; nothing is deleted.
        remove: () => this.setState({ units: st.units.filter((x) => x.name !== u.name) }),
      })),
      nextLabel: st.units.length ? 'Next' : 'Skip for now',
      samples: mkSamples([{ k: 'empty', label: 'Empty' }, { k: 'two', label: '2 added' }], st.sample,
        (k) => this.setState(k === 'empty' ? { sample: k, units: [], draft: '', err: '' }
          : { sample: k, units: [{ name: 'Fridge 1', type: 'Fridge' }, { name: 'Chest freezer', type: 'Freezer' }], draft: '', err: '' })),
    };
  }
}
</script>
</body>
</html>
