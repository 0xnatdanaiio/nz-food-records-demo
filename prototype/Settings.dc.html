<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<style>html{touch-action:manipulation}@media (min-width:520px){html,body{background:#0E2A2C}body>div>div>div[style*="width: 390px"]{margin:24px auto;border-radius:28px;overflow:hidden}}</style>
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6B72}a:hover{color:#08555B}
.docket{flex:none;position:relative;background:#FFFFFF;border-radius:20px;padding:14px 16px}

.txt{width:100%;box-sizing:border-box;min-height:52px;border:2px solid #6F8885;border-radius:16px;padding:10px 12px;font-family:inherit;font-size:16px;color:#0E2A2C;background:#FFFFFF}
textarea.txt{min-height:64px;resize:vertical}
.txt::placeholder,.temp::placeholder,.big::placeholder{color:#A3B5B2}
.temp{min-width:0;box-sizing:border-box;height:64px;border:2px solid #6F8885;border-radius:16px;font-size:29px;text-align:center;color:#0E2A2C;background:#FFFFFF;font-weight:800;letter-spacing:-0.02em}
.big{width:100%;box-sizing:border-box;min-width:0;height:88px;border:2px solid #6F8885;border-radius:20px;font-size:52px;text-align:center;color:#0E2A2C;background:#FFFFFF;font-weight:900;letter-spacing:-0.04em}
.big:focus,.txt:focus,.temp:focus{outline:3px solid #0B6B72;outline-offset:1px;border-color:#0B6B72}
.pm{flex:none;width:64px;height:64px;border-radius:9999px;border:2px solid #6F8885;background:#FFFFFF;color:#0E2A2C;font-size:24px;cursor:pointer;font-weight:800;letter-spacing:-0.02em}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:9999px;border:1.5px solid currentColor;white-space:nowrap}
.lbl{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.hint{margin:0;display:flex;align-items:center;gap:6px;font-size:15px;color:#4A5E60}
.how{min-width:48px;justify-content:center;display:flex;align-items:center;gap:6px;min-height:48px;margin:-6px 0 -10px;padding:0 8px 0 0;border:0;background:transparent;color:#FFFFFF;font-family:inherit;font-size:15px;font-weight:700;text-decoration:underline;cursor:pointer}
.tip{min-width:48px;display:inline-flex;align-items:center;gap:6px;min-height:48px;margin:-8px 0 -10px;padding:0;border:0;background:transparent;color:#0B6B72;font-family:inherit;font-size:15px;font-weight:700;text-decoration:underline;cursor:pointer;align-self:flex-start}
.ok{display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:20px;background:#DFF5EE;color:#08555B;font-weight:700;font-size:14px}
.bad{display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:20px;background:#FBE6D9;color:#7E3209;font-weight:700;font-size:14px}
.row{display:flex;align-items:center;gap:10px;min-height:48px}
.chg{min-height:48px;padding:0 4px;border:0;background:transparent;color:#0B6B72;font-family:inherit;font-size:15px;font-weight:700;text-decoration:underline;cursor:pointer;display:flex;align-items:center}
.sOk{margin:0;padding:10px 12px;border-radius:20px;background:#DFF5EE;color:#08555B;font-weight:700}
.sBad{margin:0;padding:10px 12px;border-radius:20px;background:#FBE6D9;color:#7E3209;font-weight:700}
.why{margin:0;padding:8px 10px;border-radius:20px;background:#E7EEEC;font-size:15px}
.src{display:block;margin-top:4px;font-size:13px;color:#4A5E60}
.mainBtn{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:20px;background:#0B6B72;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:17px}
.warnBtn{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:20px;background:#A9440C;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:17px}
.offBtn{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:20px;background:#D5DFDC;color:#4A5E60;font-weight:700;font-size:17px}
.bar{padding:12px 16px 16px;background:#E7EEEC}
.nav{min-height:56px;border-radius:9999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;color:#FFFFFF;text-decoration:none;letter-spacing:-0.01em}
.ico{flex:none;width:44px;height:44px;border-radius:9999px;background:#E7EEEC;display:flex;align-items:center;justify-content:center}
.key{min-height:64px;border:0;border-radius:9999px;background:#E7EEEC;color:#0E2A2C;font-size:23px;cursor:pointer;font-weight:800;letter-spacing:-0.02em}
.key:active{background:#D5E2DF}
.key:disabled{color:#4A5E60;background:#D5DFDC;cursor:default}
.kw{font-family:'Inter', system-ui, sans-serif;font-size:16px;font-weight:700}
</style>

<style>
.srow{display:flex;align-items:center;gap:12px;min-height:56px;color:#0E2A2C;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E7EEEC; font-family: 'Inter', system-ui, sans-serif; color: #0E2A2C; display: flex; flex-direction: column">
  <div style="flex: none; background: #0E2A2C; color: #FFFFFF; border-radius: 0 0 28px 28px; padding: 14px 20px 24px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 4px; min-height: 48px; margin: -2px 0; padding-right: 12px; color: #FFFFFF; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.back}}"></path></svg>
        Today
      </a>
      <p style="margin: 0; font-size: 12px; color: #A9C4C2">Prototype with sample data</p>
    </div>
    <h1 style="margin: 0; font-size: 36px; line-height: 0.9; font-weight: 900; letter-spacing: -0.045em; text-transform: uppercase">Settings</h1>
  </div>

  <div style="flex: 1; overflow: auto; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 16px">
    <div class="docket" style="display: flex; flex-direction: column">
      <a class="srow" href="Account.dc.html">
        <span class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B6B72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.person}}"></path></svg></span>
        <span style="flex: 1"><b style="font-size: 17px">Account</b><br><span style="font-size: 15px; color: #4A5E60">Harbour Café · Trial: 12 days left</span></span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E2A2C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.chevron}}"></path></svg>
      </a>
      <a class="srow" href="Suppliers.dc.html" style="border-top: 1px solid #DDE6E4; padding-top: 8px">
        <span class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B6B72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.supplier}}"></path></svg></span>
        <span style="flex: 1"><b style="font-size: 17px">Suppliers</b><br><span style="font-size: 15px; color: #4A5E60">3 active · 1 archived</span></span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E2A2C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.chevron}}"></path></svg>
      </a>
      <a class="srow" href="StaffTraining.dc.html" style="border-top: 1px solid #DDE6E4; padding-top: 8px">
        <span class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B6B72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.team}}"></path></svg></span>
        <span style="flex: 1"><b style="font-size: 17px">Staff</b><br><span style="font-size: 15px; color: #4A5E60">4 people</span></span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E2A2C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.chevron}}"></path></svg>
      </a>
    </div>

    <h2 class="lbl" style="margin: 4px 0 -6px; color: #4A5E60">Download records</h2>
    <div class="docket" style="display: flex; flex-direction: column">
      <sc-for list="{{downloads}}" as="d" hint-placeholder-count="3">
        <button type="button" class="srow" style="{{d.style}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B6B72" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.download}}"></path></svg>
          <span style="flex: 1; text-align: left; font-size: 16px; font-weight: 700; color: #0B6B72">{{d.label}}</span>
        </button>
      </sc-for>
      <p class="hint" style="font-size: 14px; margin-top: 6px">Works offline. Old records stay downloadable.</p>
    </div>
  </div>
</div>
</x-dc>

</body>
</html>
